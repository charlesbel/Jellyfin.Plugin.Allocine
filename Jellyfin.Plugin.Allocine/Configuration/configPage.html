<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Allociné Ratings</title>
</head>
<body>
    <div id="AllocineConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="AllocineConfigForm">
                    <div class="checkboxContainer checkboxContainer-withDescription">
                        <label class="emby-checkbox-label">
                            <input id="chkWriteNativeAllocineIds" name="WriteNativeAllocineIds" type="checkbox" is="emby-checkbox" />
                            <span>Écrire automatiquement l'identifiant AlloCiné</span>
                        </label>
                        <div class="fieldDescription">
                            Le plugin remplit l'identifiant AlloCiné quand il le trouve, y compris depuis la
                            tâche planifiée. Un identifiant que vous avez tapé à la main n'est jamais modifié.
                            Les notes Presse et Spectateurs restent des badges : elles ne remplacent pas les
                            notes Jellyfin.
                        </div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Enregistrer</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var AllocineConfig = {
                pluginUniqueId: '93a5b760-3774-43b3-8d99-09a473434680'
            };

            document.querySelector('#AllocineConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(AllocineConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#chkWriteNativeAllocineIds').checked = config.WriteNativeAllocineIds !== false;
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#AllocineConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(AllocineConfig.pluginUniqueId).then(function (config) {
                        config.WriteNativeAllocineIds = document.querySelector('#chkWriteNativeAllocineIds').checked;
                        ApiClient.updatePluginConfiguration(AllocineConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });

                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
