name: '🚀 Publish Plugin'

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔧 Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 💾 Install JPRM
        run: pip install jprm

      - name: 🏷️ Inject Version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid release version" >&2
            exit 1
          fi
          VERSION=${RELEASE_TAG#v}
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${VERSION}.0"
          fi
          sed -i "s/version: .*/version: \"$VERSION\"/" build.yaml

      - name: 📦 Build & Package
        run: |
          jprm --verbosity=debug plugin build . --output .
          mv *.zip Jellyfin.Plugin.Allocine.zip

      - name: ⬆️ Upload Asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: Jellyfin.Plugin.Allocine.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Update Manifest
        if: github.event_name == 'release'
        env:
          JP_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          git fetch origin master
          git checkout -B master origin/master
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if [ ! -f "manifest.json" ]; then
            jprm repo init .
          fi

          jprm repo add --url="$JP_URL" . Jellyfin.Plugin.Allocine.zip

          sed -i 's|allocine-ratings/[^"]*\.zip|Jellyfin.Plugin.Allocine.zip|g' manifest.json

          git add manifest.json
          git diff --staged --quiet || git commit -m "🤖 Update manifest to $RELEASE_TAG"
          git push origin master
